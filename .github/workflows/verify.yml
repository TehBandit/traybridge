name: Verify development build
on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '0 14 * * 1'
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-2022
    defaults:
      run:
        shell: powershell
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1 # v5
        with:
          global-json-file: global.json
      - name: Audit runtime and dependencies
        run: ./scripts/AuditDependencies.ps1
      - name: Build and verify native restoration
        run: ./build.ps1 -Publish -Unsigned -TestNativeRestoration
      - name: Test uninstall and recovery
        run: |
          $env:DOTNET_CLI_HOME = "$pwd/.tools/dotnet-home"
          $env:NUGET_PACKAGES = "$pwd/.tools/packages"
          dotnet run --project tests/TrayBridge.Uninstall.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Uninstall/recovery tests failed.' }
      - name: Test release guards and signing order
        run: |
          ./tests/ReleaseBuild.Tests.ps1
          ./tests/ReleaseSigning.Tests.ps1
          ./tests/UnsignedPreview.Tests.ps1 -PublishedDirectory ./dist
      - name: Package development binaries and source
        run: ./scripts/NewReleasePackage.ps1 -PublishedDirectory ./dist -OutputDirectory ./artifacts/ci-package -UnsignedDevelopment
      - name: Verify packaged archives
        run: ./tests/ReleasePackage.Tests.ps1 -PackageDirectory ./artifacts/ci-package -PublishedDirectory ./dist
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: TrayBridge-development
          path: artifacts/ci-package/*
          if-no-files-found: error
